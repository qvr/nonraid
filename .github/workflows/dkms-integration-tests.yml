name: NonRAID Integration Tests

on:
  pull_request:
    paths:
      - 'md_nonraid/**'
      - 'raid6/**'
      - 'dkms.conf'
      - 'Makefile'
      - 'tools/**'
      - 'tests/integration/**'
      - '.github/workflows/dkms-integration-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'md_nonraid/**'
      - 'raid6/**'
      - 'dkms.conf'
      - 'Makefile'
      - 'tools/**'
      - 'tests/integration/**'
  schedule:
    - cron: '0 3 * * 0'  # Run 1 hour after build tests

jobs:
  integration-test:
    runs-on: ubuntu-latest
    name: NonRAID Integration Tests
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential dkms gdisk xfsprogs shellcheck

      - name: ShellCheck test scripts
        run: shellcheck -x tests/integration/*.sh

      - name: Extract DKMS version
        run: |
          DKMS_VERSION=$(grep "^PACKAGE_VERSION=" dkms.conf | cut -d= -f2)
          echo "DKMS_VERSION=$DKMS_VERSION" >> $GITHUB_ENV
          echo "Detected DKMS version: $DKMS_VERSION"

      - name: Install kernel headers
        run: |
          # Install headers for the running kernel
          sudo apt-get install -y linux-headers-$(uname -r)

          # Verify headers are installed
          KVERSION=$(uname -r)
          echo "Using kernel version: $KVERSION"
          ls -la /lib/modules/$KVERSION/build/ || echo "Build symlink not found"
          ls -la /usr/src/linux-headers-* || echo "No headers found in /usr/src"

      - name: Prepare DKMS source
        run: |
          # Copy source to DKMS source directory
          DKMS_SRC_DIR="/usr/src/nonraid-dkms-$DKMS_VERSION"
          sudo mkdir -p "$DKMS_SRC_DIR"
          sudo cp -r md_nonraid/ raid6/ dkms.conf Makefile "$DKMS_SRC_DIR/"

          echo "DKMS source directory contents:"
          ls -la "$DKMS_SRC_DIR"

      - name: Build and install modules
        run: |
          # Add and build module
          sudo dkms add nonraid-dkms/$DKMS_VERSION
          if ! sudo dkms build nonraid-dkms/$DKMS_VERSION; then
            echo "::group::dkms build failed - dumping make.log"
            MAKE_LOGS=$(sudo find /var/lib/dkms/nonraid-dkms/$DKMS_VERSION/ -name "make.log")
            if [ -n "$MAKE_LOGS" ]; then
              for LOG in $MAKE_LOGS; do
                echo "--- $LOG (last 200 lines) ---"
                sudo tail -n 200 "$LOG"
              done
            else
              echo "No make.log found under /var/lib/dkms/nonraid-dkms/$DKMS_VERSION/"
            fi
            echo "::endgroup::"
            exit 1
          fi
          sudo dkms install nonraid-dkms/$DKMS_VERSION

          echo "DKMS status after install:"
          sudo dkms status

      - name: Check modules
        run: |
          # The test harness loads md-nonraid itself, with a per-test superblock
          modinfo nonraid6_pq
          modinfo md_nonraid

      - name: Run integration tests
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_STEP_SUMMARY tests/integration/run.sh
